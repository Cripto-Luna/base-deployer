<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Base Contract Deployer</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { color: #3b82f6; }
    p { color: #94a3b8; margin-top: 4px; }
    .wallet-option { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; margin: 8px 0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .wallet-option:hover { border-color: #3b82f6; }
    .wallet-option img { width: 28px; height: 28px; border-radius: 4px; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 8px 4px; }
    button:disabled { background: #334155; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #2563eb; }
    .box { background: #1e293b; border-radius: 10px; padding: 16px; margin: 12px 0; word-break: break-all; }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
    .addr { color: #60a5fa; font-weight: bold; }
    #log { max-height: 300px; overflow-y: auto; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Base Mainnet — Deploy Contrato</h1>
  <p>Selecciona MetaMask para deploar desde tu EOA</p>

  <div id="walletList">
    <p style="color:#94a3b8">Wallets detectadas:</p>
    <div id="walletBtns"><p style="color:#64748b">Buscando wallets...</p></div>
  </div>

  <div class="box" id="info" style="display:none">
    <div>Red: <span id="network"></span></div>
    <div>Wallet: <span id="wallet" style="font-size:12px"></span></div>
    <div>Balance: <span id="balance"></span> ETH</div>
  </div>

  <button id="btnDeploy" disabled>Deploar Contrato en Base</button>
  <div style="color:#94a3b8; font-size:13px; margin-bottom:12px;">Solo gas (~0.000035 ETH) — sin fee de servicio</div>

  <div class="box" id="log"></div>

  <script>
    const BASE_CHAIN_ID = 8453n;
    const SIMPLE_BYTECODE = "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2646970667358221220a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a064736f6c63430008140033";

    let provider, signer;
    let deployCount = 0;
    const wallets = [];

    function log(msg, cls = '') {
      const d = document.getElementById('log');
      d.innerHTML += `<div class="${cls}">${new Date().toLocaleTimeString()} — ${msg}</div>`;
      d.scrollTop = d.scrollHeight;
    }

    // EIP-6963: detectar wallets individualmente (evita que Rabby intercepte)
    window.addEventListener('eip6963:announceProvider', (e) => {
      const { info, provider: p } = e.detail;
      if (!wallets.find(w => w.info.uuid === info.uuid)) {
        wallets.push({ info, provider: p });
        renderWallets();
      }
    });

    function renderWallets() {
      const container = document.getElementById('walletBtns');
      container.innerHTML = '';
      wallets.forEach(({ info, provider: p }) => {
        const div = document.createElement('div');
        div.className = 'wallet-option';
        div.innerHTML = `${info.icon ? `<img src="${info.icon}">` : ''}<strong>${info.name}</strong><span style="color:#64748b;font-size:12px;margin-left:auto">Click para conectar</span>`;
        div.addEventListener('click', () => connect(p, info.name));
        container.appendChild(div);
      });
      if (wallets.length === 0) {
        container.innerHTML = '<p style="color:#64748b">No se detectaron wallets EOA.</p>';
      }
    }

    window.dispatchEvent(new Event('eip6963:requestProvider'));

    async function connect(rawProvider, name) {
      try {
        log(`Conectando con ${name}...`);

        // Cambiar a Base mainnet
        try {
          await rawProvider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x2105' }] });
        } catch (sw) {
          if (sw.code === 4902) {
            await rawProvider.request({ method: 'wallet_addEthereumChain', params: [{
              chainId: '0x2105', chainName: 'Base',
              nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
              rpcUrls: ['https://mainnet.base.org'],
              blockExplorerUrls: ['https://basescan.org']
            }]});
          }
        }

        provider = new ethers.BrowserProvider(rawProvider);
        await provider.send('eth_requestAccounts', []);
        signer = await provider.getSigner();
        const network = await provider.getNetwork();
        const addr = await signer.getAddress();
        const bal = await provider.getBalance(addr);

        document.getElementById('network').innerHTML =
          network.chainId === BASE_CHAIN_ID
            ? `<span class="ok">Base Mainnet ✅</span>`
            : `<span class="err">Chain ${network.chainId} — necesitas Base (8453)</span>`;
        document.getElementById('wallet').textContent = addr;
        document.getElementById('balance').textContent = parseFloat(ethers.formatEther(bal)).toFixed(6);
        document.getElementById('info').style.display = 'block';

        if (network.chainId === BASE_CHAIN_ID) {
          document.getElementById('btnDeploy').disabled = false;
          log(`✅ Conectado: ${addr}`, 'ok');
        } else {
          log('Cambia la red a Base en tu wallet.', 'err');
        }
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }

    document.getElementById('btnDeploy').addEventListener('click', async () => {
      try {
        deployCount++;
        log(`Deployando contrato #${deployCount}...`);
        document.getElementById('btnDeploy').disabled = true;
        const factory = new ethers.ContractFactory([], SIMPLE_BYTECODE, signer);
        const contract = await factory.deploy();
        log(`TX: ${contract.deploymentTransaction().hash}`);
        await contract.waitForDeployment();
        const addr = await contract.getAddress();
        log(`✅ Contrato #${deployCount}: <span class="addr">${addr}</span>`, 'ok');
        document.getElementById('btnDeploy').disabled = false;
      } catch (e) {
        log('Error: ' + e.message, 'err');
        document.getElementById('btnDeploy').disabled = false;
      }
    });
  </script>
</body>
</html>
