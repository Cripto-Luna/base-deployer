<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Base Contract Deployer</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { color: #3b82f6; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 8px 4px; }
    button:disabled { background: #334155; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #2563eb; }
    .box { background: #1e293b; border-radius: 10px; padding: 16px; margin: 12px 0; word-break: break-all; }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
    .addr { color: #60a5fa; font-weight: bold; }
    #log { max-height: 300px; overflow-y: auto; }
    .wallet-btn { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 12px 16px; }
    #walletList { display: none; }
  </style>
</head>
<body>
  <h1>Base Mainnet — Deploy Contrato</h1>

  <div id="walletList" class="box">
    <p style="margin:0 0 10px">Elige tu wallet:</p>
    <div id="walletBtns"></div>
  </div>

  <button id="btnConnect">Conectar Wallet</button>

  <div class="box" id="info" style="display:none">
    <div>Red: <span id="network"></span></div>
    <div>Wallet: <span id="wallet"></span></div>
    <div>Balance: <span id="balance"></span> ETH</div>
  </div>

  <button id="btnDeploy" disabled>Deploar Contrato en Base</button>
  <div style="color:#94a3b8; font-size:13px;">Solo gas (~0.000035 ETH) — sin fee de servicio</div>

  <div class="box" id="log"></div>

  <script>
    const BASE_CHAIN_ID = 8453n;
    const SIMPLE_BYTECODE = "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2646970667358221220a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a064736f6c63430008140033";

    let provider, signer, chainId;
    let deployCount = 0;
    const detectedProviders = [];

    function log(msg, cls = '') {
      const d = document.getElementById('log');
      d.innerHTML += `<div class="${cls}">${msg}</div>`;
      d.scrollTop = d.scrollHeight;
    }

    // EIP-6963: detectar todas las wallets disponibles
    window.addEventListener('eip6963:announceProvider', (event) => {
      const { info, provider: p } = event.detail;
      if (!detectedProviders.find(x => x.info.uuid === info.uuid)) {
        detectedProviders.push({ info, provider: p });
        log(`Wallet detectada: ${info.name}`);
      }
    });
    window.dispatchEvent(new Event('eip6963:requestProvider'));

    document.getElementById('btnConnect').addEventListener('click', () => {
      const list = document.getElementById('walletList');
      const btns = document.getElementById('walletBtns');
      btns.innerHTML = '';

      // Mostrar wallets EIP-6963 detectadas
      if (detectedProviders.length > 0) {
        detectedProviders.forEach(({ info, provider: p }) => {
          const btn = document.createElement('button');
          btn.className = 'wallet-btn';
          btn.innerHTML = `${info.icon ? `<img src="${info.icon}" style="width:20px;vertical-align:middle;margin-right:8px">` : ''} ${info.name}`;
          btn.addEventListener('click', () => connectWith(p, info.name));
          btns.appendChild(btn);
        });
      }

      // Siempre mostrar opción window.ethereum como fallback
      if (window.ethereum) {
        const btn = document.createElement('button');
        btn.className = 'wallet-btn';
        btn.textContent = 'Coinbase Wallet / Otra (window.ethereum)';
        btn.addEventListener('click', () => connectWith(window.ethereum, 'window.ethereum'));
        btns.appendChild(btn);
      }

      list.style.display = btns.children.length > 0 ? 'block' : 'none';
      if (btns.children.length === 0) log('No se detectó ninguna wallet.', 'err');
    });

    async function connectWith(rawProvider, name) {
      document.getElementById('walletList').style.display = 'none';
      try {
        log(`Conectando con ${name}...`);
        provider = new ethers.BrowserProvider(rawProvider);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        const network = await provider.getNetwork();
        chainId = network.chainId;
        const addr = await signer.getAddress();
        const bal = await provider.getBalance(addr);

        document.getElementById('network').innerHTML =
          chainId === BASE_CHAIN_ID
            ? `<span class="ok">Base Mainnet ✅ (${chainId})</span>`
            : `<span class="err">Chain ID ${chainId} — necesitas Base Mainnet (8453)</span>`;
        document.getElementById('wallet').textContent = addr;
        document.getElementById('balance').textContent = ethers.formatEther(bal);
        document.getElementById('info').style.display = 'block';

        if (chainId === BASE_CHAIN_ID) {
          document.getElementById('btnDeploy').disabled = false;
          log(`✅ Conectado en Base Mainnet con ${name}`, 'ok');
        } else {
          log(`Estás en chain ${chainId}. Cambia a Base Mainnet en tu wallet.`, 'err');
        }
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }

    document.getElementById('btnDeploy').addEventListener('click', async () => {
      try {
        deployCount++;
        log(`Deployando contrato #${deployCount}...`);
        document.getElementById('btnDeploy').disabled = true;
        const factory = new ethers.ContractFactory([], SIMPLE_BYTECODE, signer);
        const contract = await factory.deploy();
        log(`TX enviada: ${contract.deploymentTransaction().hash}`);
        await contract.waitForDeployment();
        const addr = await contract.getAddress();
        log(`✅ Contrato #${deployCount}: <span class="addr">${addr}</span>`, 'ok');
        document.getElementById('btnDeploy').disabled = false;
      } catch (e) {
        log('Error: ' + e.message, 'err');
        document.getElementById('btnDeploy').disabled = false;
      }
    });
  </script>
</body>
</html>
